# Backtest: Kapital, Ausführung, Kosten, Steuern, Tresor
# Entscheidungen von Jakob am 01.11.2026. Änderungen an Regeln und Limits nur mit seiner Zustimmung.

kapital:
  start: 500.0
  aufteilung: {core: 0.70, satellite: 0.30}
  # Entscheidung 01.11.2026: Echte Satellite-Trades erst ab 1.250 € Satellite-Kapital (10 % Position = 125 €
  # Mindestorder). Bis dahin fließt der Satellite-Anteil in den Core-ETF, und der Satellite läuft als
  # Schattenportfolio mit virtuellen 1.250 € nach allen Regeln inklusive Kosten und Steuern, getrennt ausgewiesen.
  satellite_mindestkapital: 1250.0
  satellite_schattenkapital: 1250.0

ausfuehrung:
  # Signal mit dem Schlusskurs von Tag t, Ausführung zur Eröffnung am nächsten Handelstag (Freigabe morgens)
  zeitpunkt: eroeffnung_folgetag
  max_gebuehr_anteil: 0.01    # gilt nur für Käufe und Aufstockungen; Ausstiege sind immer erlaubt
  ganze_stuecke: true         # Bruchteilsaktien gibt es über die IBKR-API nicht

kosten:
  # Von Jakob gegen die IBKR-Preisliste geprüft (01.11.2026)
  gebuehren:
    EUR: {satz: 0.0005, minimum: 1.25, maximum: 29.0}           # EU-Aktien und ETFs; 1,25 € Minimum setzt IBKR „Gestaffelt“ (Tiered) voraus – echtes Konto seit 04.11.2026 umgestellt (vorher Festpreis, 3 € Minimum bei SMART)
    USD: {je_stueck: 0.005, minimum: 1.0, max_anteil: 0.01}      # US-Aktien, Beträge in USD
  spread:                     # halbe Geld-Brief-Spanne je Instrumentklasse
    etf: 0.0005
    aktie: 0.0010
    klein: 0.0025
  slippage: 0.0005
  waehrungstausch: {satz: 0.00002, minimum_usd: 2.0}

steuern:
  # Heutiges Recht gilt für alle simulierten Jahre (Details und Paragrafen in src/tradingbot/backtest/steuern.py)
  abgeltungsteuer: 0.25
  soli: 0.055
  kirchensteuer: 0.0          # Jakob zahlt keine Kirchensteuer
  sparer_pauschbetrag: 1000.0 # steht vollständig dem Bot zu
  teilfreistellung: {aktienfonds: 0.30, mischfonds: 0.15, sonstiger_fonds: 0.0}
  quellensteuer: {USD: 0.15}  # US-Dividenden mit W-8BEN
  zahlung: jahresende_abfluss # Steuer als eigener Abfluss am Jahresende, kein Zwangsverkauf
  # Steuergruppen teilen Pauschbetrag und Verlusttöpfe. Das echte Depot (Core plus ggf. echter Satellite) ist
  # eine Gruppe und bekommt den vollen Pauschbetrag (Jakob hat keine anderen nennenswerten Kapitalerträge).
  # Der Schatten-Satellite bekommt keinen Pauschbetrag (den nutzt im echten Depot der Core), damit er nicht
  # besser aussieht, als er wäre (bestätigt 01.11.2026). Unbekannte Gruppen (z.B. Benchmark) bekommen 1.0.
  pauschbetrag_anteil: {depot: 1.0, schatten: 0.0}
  # Basiszins für die Vorabpauschale in Prozent (von Jakob geprüft, 01.11.2026).
  # 2018–2026: BMF-Schreiben zur Vorabpauschale. 2012–2016: Basiszins nach § 203 Abs. 2 BewG a.F. (die
  # Vorabpauschale gab es erst ab 2018; Ansatz, weil der Backtest heutiges Recht auf alle Jahre anwendet).
  # 2017: NÄHERUNG, kein amtlicher Wert (§ 203 BewG hat seit 2016 einen festen Kapitalisierungsfaktor).
  basiszins_prozent:
    2012: 2.44
    2013: 2.04
    2014: 2.59
    2015: 0.99
    2016: 1.10
    2017: 0.59   # Näherung, nicht amtlich
    2018: 0.87
    2019: 0.52
    2020: 0.07
    2021: -0.45
    2022: -0.05
    2023: 2.55
    2024: 2.29
    2025: 2.53
    2026: 3.20

risikofreier_zins: ECBDFR     # EZB-Einlagesatz (FRED), für Sharpe Ratio und Jensens Alpha

tresor:
  # Daten ab diesem Tag sind gesperrt. Regeln (Jakob, 01.11.2026):
  # 1. Einmal pro Phase öffnen, erst wenn Regeln und Parameter feststehen.
  # 2. Bei schlechtem Ergebnis nicht nachjustieren und erneut testen. Erkenntnis notieren, zurück auf die
  #    Entwicklungsdaten; als neue Prüfung dient das Paper Trading.
  # 3. Das Paper Trading ist der zweite, noch strengere Tresor, weil diese Daten heute noch nicht existieren.
  gesperrt_ab: 2025-01-01
  protokoll: docs/TRESOR_PROTOKOLL.md

phase2_gesamtdepot:                    # Abschluss-Backtest Phase 2 (docs/PHASE2.md), festgeschrieben 03.11.2026
  von: 2016-10-01
  bis: 2024-12-31
  start_eur: 500.0
  einzahlung_eur: 100.0
  einzahlung_tag: erster_handelstag_monat
  etf: SPYI.DE
  kauf_limit_aufschlag: 0.02           # Vortagesschluss + 2 %, auf Cent abgerundet
  risk_buch: real                      # Regeln des Realbuchs; Bot-Budget = Start plus Einzahlungen bis zum Tag
  kriterien:
    max_abweichung_index_pp: 0.5       # TWR p.a. vor Steuern gegen kostenfreien ACWI IMI
    max_abweichung_zwilling_pp: 0.2    # TWR p.a. nach Steuern und nach fiktivem Verkauf gegen den Zwilling
    notbremse_pp: 10.0                 # 12 Monate Rückstand (TWR) gegen ACWI IMI

