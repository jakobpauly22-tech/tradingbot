# Betrieb: Paper Trading, Broker-Anbindung, Freigaben (Phase 2, Entscheidungen Jakob 02.11.2026)
# Live (Port 4001) bleibt gesperrt, bis Jakob nach den Go-Live-Kriterien ausdrücklich freigibt.

core:
  etf: SPYI.DE                         # SPDR MSCI ACWI IMI, gleich dem Hauptbenchmark
  isin: IE00B3YLTY66                   # für die Kontraktzuordnung bei IBKR (config/kontrakte.yaml)
  ganze_stuecke: true                  # Rest unter einem Anteil bleibt Kasse und wird mit dem nächsten Betrag investiert

bot_budget:
  betrag_eur: 500.0                    # Budget des Realbuchs im Paper-Konto; der Rest des Kontos wird ignoriert
  abgleich: taeglich                   # je Buch: Bestände gegen IBKR; bei Abweichung stoppt der Tageslauf mit Meldung

# Bücher im Paper-Konto (Entscheidung Jakob 02.11.2026). Jedes Buch hat eigenes Budget, eigene Höchststände für die
# Satellite-Limits, eigenen Abgleich und eigenes Journal; Orders tragen das Buch als Kennung (IBKR orderRef).
# Zweck der Skalierungsbücher (vorab festgeschrieben): Signalqualität ohne Kostenverzerrung messen und prüfen, ab welchem
# Kapital ein Satellite sinnvoll wäre. Ergebnisse der Skalierungsbücher begründen NIE echte Trades mit kleinerem Kapital.
# Vergleich je Buch: SPYI mit gleichem Kapital, rechnerisch (Buy & Hold ab Buchstart).
# Satellite-Limits (−10 % Monat, −20 % vom Höchststand): in Skalierungsbüchern nur protokolliert („hätte gesperrt am …“),
# im Realbuch sperrend; alle harten Regeln (Kasse, long-only, Not-Aus, Doppel-Order, Plausibilität, Orderwert) überall (02.11.2026).
buecher:
  real:
    art: real
    budget_eur: 500.0
    rolle: core                        # Core 500 € in SPYI; Satellite-Anteil fließt in den Core; Strategien nur als Schatten
    max_orders_pro_tag: 5
    freigabe: einzeln                  # bei echtem Geld immer einzeln je Order
    senden_freigeschaltet: true           # 03.11.2026: freigeschaltet
  fundamental_a:
    art: skalierung
    budget_eur: 10000.0                # entspricht dem Fundamental-Backtest
    rolle: core                        # 20 Einzelaktien, Originalscore (docs/FUNDAMENTAL.md)
    max_orders_pro_tag: 25
    freigabe: sammel                   # Sammelfreigabe je Buch, nur im Paper-Konto
    senden_freigeschaltet: true           # 04.11.2026: freigeschaltet (Jakob; Fundamental nach Fertigstellung von Nachkauf und Limit-On-Open)
  fundamental_b:
    art: skalierung
    budget_eur: 10000.0
    rolle: core                        # nur Qualitätshälfte
    max_orders_pro_tag: 25
    freigabe: sammel
    senden_freigeschaltet: true           # 04.11.2026: freigeschaltet (Jakob; Fundamental nach Fertigstellung von Nachkauf und Limit-On-Open)
  crossover:
    art: skalierung
    budget_eur: 10000.0                # ab hier wirkt die Mindestgebühr nicht mehr (Orders ≥ 2.500 €)
    rolle: satellite
    max_orders_pro_tag: 25
    freigabe: sammel
    senden_freigeschaltet: true           # 03.11.2026: freigeschaltet
  momentum:
    art: skalierung
    budget_eur: 10000.0
    rolle: satellite
    max_orders_pro_tag: 25
    freigabe: sammel
    senden_freigeschaltet: true           # 04.11.2026: freigeschaltet (Jakob; Fundamental nach Fertigstellung von Nachkauf und Limit-On-Open)

ibkr:
  host: 127.0.0.1                      # nur lokal
  port_paper: 4002
  port_live: 4001                      # gesperrt (Code verweigert die Verbindung)
  konto_praefix_paper: DU              # Senden nur, wenn die Konto-ID damit beginnt
  modus_variable: TRADING_MODE         # aus .env; nur „paper“ erlaubt
  bibliothek: ib_async                 # bei Problemen mit Python 3.15: ältere Python-Version im venv, nicht die Bibliothek wechseln
  # Freischaltung durch Jakob am 03.11.2026 (ausdrücklich): global an, je Buch zusätzlich `senden_freigeschaltet` unten.
  senden_freigeschaltet: true

orders:
  kauf: {typ: limit, aufschlag_vortagesschluss: 0.02}   # gesendet sofort nach der Abendfreigabe, geht in die Xetra-Eröffnungsauktion
  verkauf: {typ: market}               # ohne Limit
  gueltigkeit: naechster_handelstag    # gültig für den nächsten Handelstag; nicht ausgeführte verfallen und stehen im Journal

waehrung:
  # Entscheidung Jakob 03.11.2026: vor den Käufen je Buch EUR → USD tauschen (geplante Käufe plus Puffer), wie im Backtest;
  # Kasse je Währung, keine darf negativ werden (Risk-Manager Regel 10). Tausch als Market-Order (IDEALPRO), gültig DAY.
  tausch_puffer: 0.02

nachtrag:
  # Ausführungen außerhalb des API-Zeitfensters (verpasster Abend; betrieb/nachtrag.py, Jakob 09.11.2026). reqExecutions
  # liefert nur den laufenden Tag. Weg: Flex-Abfrage (FLEX_TOKEN, FLEX_QUERY_ID in .env), sonst Position mit Einstand (nur
  # Käufe, Order erklärt die Position allein, Preis innerhalb Tief/Hoch des Ausführungstags). Ohne Beleg stoppt der Tageslauf.
  # IBKR führt den Einstand inklusive Gebühr; für den Weg über die Position gilt die Gebühr je Markt und Währung nach dem
  # Festpreis-Plan des Paper-Kontos (Jakob 09.11.2026). Sie wird als „angenommen“ markiert und beim nächsten Flex-Abruf
  # abgeglichen. Leer (null) = nur Flex.
  gebuehr:
    xetra_eur: {je_order: 3.00}          # Paper-Konto, von IBKR je Order gemeldet (docs/BETRIEB.md, 04.11.2026)
    # IBKR Pro Fixed, United States: USD 0.005 je Aktie, Minimum USD 1.00, Maximum 1 % des Orderwerts.
    # Quelle: https://www.interactivebrokers.com/en/pricing/commissions-stocks.php (geprüft 09.11.2026). Regulierungsgebühren
    # bei Käufen nur FINRA CAT (USD 0.000003 je Stück), vernachlässigt; SEC/FINRA TAF nur bei Verkäufen (kein Nachtrag).
    us_usd: {je_aktie: 0.005, minimum: 1.00, maximum_anteil: 0.01}

freigabe:
  # Tageslauf abends nach Börsenschluss; Freigabe 18–24 Uhr; Orders werden sofort nach der Freigabe gesendet, gültig für
  # den nächsten Handelstag. Das IB Gateway muss nur während der Freigabe laufen, morgens ist nichts nötig (02.11.2026).
  tageslauf: abends_nach_boersenschluss
  fenster: {von: "18:00", bis: "24:00"}
  senden: sofort_nach_freigabe
  ohne_freigabe: verfaellt             # verpasste Freigabe = verpasster Trade

sicherheit:
  not_aus_datei: STOP                  # existiert die Datei STOP im Projektordner, wird nichts gesendet
  doppel_orders: pruefen               # vor dem Senden offene Orders prüfen; jeder Vorschlag nur einmal
  plausibilitaet:
    # Orderwert höchstens das Budget des Buchs; Orders je Tag je Buch (buecher.*.max_orders_pro_tag, 02.11.2026)
    max_limit_abstand: 0.02            # Kauflimit höchstens 2 % über dem letzten Kurs

daten:
  # Betriebsfreigabe (Jakob 02.11.2026): Der Tageslauf darf Kurse ab 2025 lesen, nur für Signale und Bücher, protokolliert.
  # Betriebsdaten liegen in einem eigenen Bereich, den Backtest- und Auswertungswerkzeuge technisch nicht lesen können.
  betriebsbereich: daten/betrieb
  kursquelle: yahoo                    # kein Xetra-Marktdaten-Abo bei IBKR (Jakob 02.11.2026)
  # Messbeginn je Buch = Tag der ersten Freigabe, im Journal festgehalten (02.11.2026)
  # Freigaben im Probe-Modus (Tageslauf_Probe.bat) oder bei ausgeschaltetem Senden zählen nie als Messbeginn (03.11.2026)

datenpruefung:                         # vor jedem Tageslauf (Jakob 02.11.2026); bei Befund an diesem Tag keine Vorschläge
  schluss_vom_letzten_handelstag: true # je Börse (Xetra, NYSE) die letzte abgeschlossene Sitzung
  max_tagessprung: 0.15                # größere Sprünge ohne Kapitalmaßnahme (Split, Ausschüttung) melden
  wirkung: buch                        # ein Befund sperrt die Vorschläge der Bücher, die den Wert brauchen

start:                                 # Jakob 02.11.2026
  fundamental: sofort_mit_aktuellem_signal_dann_quartalsweise
  technik: ab_erstem_signal

journal:
  datei: daten/betrieb/journal.sqlite
  backup_variable: JOURNAL_BACKUP_DIR  # Zielordner außerhalb des Repos (.env), Kopie nach jedem Tageslauf
  konto_anzeige: gekuerzt              # Kontonummer nur gekürzt (z.B. „DUR3…“)

bedienung:
  start: Tageslauf.bat                 # Doppelklick, ohne Terminal: Tageslauf und Freigabe in einem Fenster
  gateway_pruefen_vor_senden: true     # nicht verbunden → sauber abbrechen, Vorschläge bleiben bis 24 Uhr freigebbar
