# Fundamental-Engine: Entscheidungen von Jakob am 02.11.2026.
# Parameter vor dem ersten Backtest festgelegt, nicht nachträglich optimieren. Änderungen nur mit Jakob.

sec:
  max_anfragen_pro_sekunde: 8          # SEC-Grenze 10/s, mit Puffer
  cache_max_alter_tage: 7              # danach werden companyfacts/submissions neu geladen
  verfuegbar_ab: handelstag_nach_filed # Point-in-Time: Werte erst ab dem Handelstag nach dem Einreichungsdatum
  restatements: erstmeldung            # bei Restatements gilt der zuerst gemeldete Wert
  jahresdauer_tage: [350, 380]         # Länge einer Geschäftsjahresperiode (52/53-Wochen-Jahre)

tiingo:
  anfragen_pro_stunde: 50              # kostenloser Zugang; bei höherem Plan anpassen

universum:
  index: SP500_historisch              # Zusammensetzung je Stichtag, nicht die heutigen Mitglieder
  # Entscheidung 02.11.2026: Finanzwerte (SIC 6000–6999, inklusive REITs) fallen im ersten Lauf ganz aus dem
  # Universum. Der SIC-Code gilt point-in-time: maßgeblich ist der Code im Kopf der jeweiligen SEC-Einreichung,
  # nicht der heutige Code aus den Stammdaten.
  ohne_finanzwerte_sic: [6000, 6999]
  sic_point_in_time: true
  ohne_branchen: [banken, versicherungen]  # für spätere Läufe mit Finanzwerten: weder Altman noch Beneish
  sic_banken: [[6000, 6199]]
  sic_versicherungen: [[6300, 6411]]
  delisting:                           # Rückfall-Regel, wenn keine Kurse nach dem Delisting vorliegen
    uebernahme_fusion: letzter_kurs
    pleite_performance_unbekannt: letzter_kurs_minus_30_prozent   # Shumway (1997)
    im_bericht_markieren: true

schattenportfolio:
  # Entscheidungen Sitzung 4 (Jakob, 03.11.2026); Code: engines/fundamental/schatten.py
  kapital: 10000.0
  titel: 20                            # höchstens 20 Positionen
  gewichtung: gleich                   # Ziel 5 % je Titel (Core-Regel: höchstens 5 % je Einzelaktie beim Kauf)
  rebalancing: Q
  max_branchenanteil: 0.25             # höchstens 25 % der Positionen (5 von 20) je Branche
  branchen_ebene: sic2                 # zweistellige SIC (Division D wäre ~45 % des Universums, Divisionsgrenze erzwänge feste Untergewichtung)
  puffer_rang: 30                      # gehaltener Titel bleibt, solange er im gefilterten Universum unter den besten 30 ist
  # Ausgeschlossene (Filter) oder aus dem S&P 500 ausgeschiedene Titel werden am nächsten Stichtag immer verkauft.
  # Freie Plätze gehen an die besten noch nicht gehaltenen Titel.
  drift_band: [0.025, 0.075]           # gehaltene Titel nur am Stichtag zurück auf 5 %, und nur außerhalb des Bands; 125-€-Regel gilt zusätzlich
  austritt_unter_quartal: halten_bis_stichtag   # außer Delisting; Erlöse aus Übernahmen bis zum Stichtag als Kasse ohne Zins
  steuergruppe: schatten
  # MSCI ACWI IMI (Haupt), S&P 500 in Euro (Universum) und S&P 500 ohne Finanzwerte in Euro (macht den Sektoreffekt
  # des Ausschlusses sichtbar; Nachbau aus dem Universum, gebaut von tools/nachbau_sp500_ohne_finanzwerte.py nach bestandener Gegenprobe)
  benchmarks: [SPYI.DE, SXR8.DE, SP500_ohne_finanzwerte]   # letzterer: daten.sp500_nachbau.lade_benchmark_sp500_ohne_finanzwerte (Spalte index_eur)
  # MSCI ACWI IMI Value Weighted: kein ETF verfügbar, im ersten Lauf weggelassen (Lücke im Bericht vermerkt).
  # Zusatzbenchmark US-Value: iShares S&P 500 Value (IVE, USD, in Euro umgerechnet), Kurse ab 2000; nur berichtet.
  # Auf Xetra gibt es ab 10/2016 nur Small-Cap- (ZPRV) oder Welt-Value-ETFs (XDEV), die das Universum schlechter abbilden.
  zusatzbenchmarks: [IVE]
  kontrollportfolio: alle Titel des gefilterten Universums gleich gewichtet, quartalsweise, ohne Kosten, vor Steuern
  risikofreier_zins: ECBDFR            # Sharpe mit EUR-Geldmarktzins (FRED)

erfolgskriterien:                      # vor dem ersten Lauf festgeschrieben (03.11.2026), docs/FUNDAMENTAL.md
  auswahl: Rendite p.a. nach Kosten und vor Steuern >= Kontrollportfolio
  risiko_sharpe: Sharpe nach Kosten >= Sharpe S&P 500 ohne Finanzwerte (EUR)
  risiko_max_drawdown_pp: 5.0          # maximaler Drawdown höchstens 5 Prozentpunkte schlechter als S&P 500 ohne Finanzwerte (EUR)
  nur_berichtet: [SXR8.DE, SPYI.DE, IVE]
filter:                                # Code: engines/fundamental/filter.py
  piotroski_min: 4                     # F-Score <= 3 wird ausgeschlossen
  # Entscheidung 03.11.2026: bei 7 oder 8 von 9 Signalen auf 9 Punkte hochrechnen und markieren; darunter Filter überspringen
  piotroski_mindestsignale: 7          # 7–8 Signale: auf 9 Punkte hochrechnen, kaufmännisch runden (03.11.2026)
  altman:
    # Entscheidungen 03.11.2026:
    # - verarbeitendes Gewerbe (SIC 2000–3999): Altman Z (1968), X4 mit Marktwert point-in-time; Gefahrenzone = harter Ausschluss
    # - Versorger (SIC 4900–4999): kein Altman
    # - übrige: Z'' (Buchwert; Grenzen auf Buchwerten geschätzt, daher kein Marktwert); Gefahrenzone allein nur Warnhinweis,
    #   Ausschluss nur zusammen mit Piotroski ≤ 3 oder negativem operativem Cashflow im letzten Geschäftsjahr
    # Finanzwerte sind ohnehin ausgeschlossen.
    industrie_sic: [2000, 3999]
    ohne_altman_sic: [4900, 4999]
    industrie: original_1968           # Gefahrenzone Z < 1,81, sicher Z > 2,99 (wissen/04, Abschnitt 8)
    uebrige: z_zwei_strich             # Gefahrenzone Z'' < 1,10, sicher Z'' > 2,60 (Altman 2000)
    uebrige_ausschluss: gefahrenzone_und_zweites_signal   # Piotroski ≤ 3 oder operativer Cashflow_t < 0
  beneish_max: -1.78                   # M > −1,78 gilt als Manipulationsverdacht (Beneish 1999)
  beneish_fehlend: ueberspringen       # nicht berechenbar → Filter überspringen und markieren (03.11.2026)

kennzahlen_regeln:
  aktualitaet_monate: 15               # letztes Geschäftsjahr höchstens 15 Monate vor dem Stichtag, sonst nicht bewertbar

multiples:
  # Entscheidung 03.11.2026: Vergleichsgruppe zweistellige SIC (Major Group) mit mindestens 5 Firmen, sonst SIC-Division.
  # Multiples als Perzentil-Rang innerhalb der Gruppe; Ausreißer vorher auf 1./99. Perzentil gekappt; negativer EV markiert.
  gruppe_min_firmen: 5
  kappung_perzentile: [0.01, 0.99]

backtest:
  # Regel (Jakob 03.11.2026): Der gewertete Backtest beginnt am ersten Rebalancing-Stichtag, ab dem alle folgenden
  # Stichtage unter 2 % nicht kaufbarem Gewicht im investierbaren Universum liegen (Quartalsbeginn des Stichtags).
  # Berechnet von tools/auswertung_abdeckung.py (abdeckung.gewerteter_beginn); weicht das Ergebnis bei neuen Daten von
  # `gewertet_ab` ab, meldet das Werkzeug das laut – das Datum wird nie still verschoben, Jakob entscheidet.
  # Davor läuft ab `vorlauf_ab` ein nicht gewerteter Vorlauf für Indikatoren. WRDS/CRSP entfällt (nur akademische Nutzung).
  vorlauf_ab: 2012-01-01
  gewertet_ab_regel: erster_stichtag_ab_dem_alle_unter_2_prozent
  gewertet_ab: 2016-10-01               # Ergebnis der Regel am 03.11.2026 (erster Handelstag des Quartals: 03.10.2016)
  gewertet_bis: 2024-12-31              # Tresor ab 2025 bleibt zu

score:
  erster_lauf: [qualitaet, multiples]  # Piotroski und Accruals; E/P und EBIT/EV gegen den Branchenmedian
  # Entscheidungen Sitzung 4 (03.11.2026): Qualität 50 %, Bewertung 50 %, je Hälfte beide Ränge gleich.
  # Der DCF kommt später in die Bewertungshälfte. Code: engines/fundamental/gesamtscore.py
  gewichte:
    qualitaet: 0.5
    bewertung: 0.5
  qualitaet: [piotroski, accruals]     # Piotroski gerundet (wie im Filter); Accruals: niedriger ist besser
  bewertung: [ep, ebit_ev]
  # Ein fehlender Score zählt neutral (Median der Vergleichsgruppe), nie als gut; markiert.
  # EBIT/EV bei negativem EV gilt als fehlend (Median, markiert).
  fehlender_score: median_der_vergleichsgruppe
  dcf_erst_nach_erstem_lauf: true
dcf:                                   # für später, Annahmen schon festgelegt
  marktrisikopraemie: 0.05
  langfristiges_wachstum: 0.02         # muss immer kleiner als die Kapitalkosten sein
  wachstum_jahre: 5
  wachstum_quelle: historisches_umsatzwachstum
  wachstum_deckel: 0.10
  risikofreier_zins: DGS10             # FRED, point-in-time
  beta: regression

# Zuordnung Kennzahl -> XBRL-Konzepte (us-gaap/dei). Je Periode gilt der erste Kandidat mit Wert.
# art: dauer = Jahreswert (Gewinn- und Verlustrechnung, Cashflow), stichtag = Bilanzwert am Geschäftsjahresende,
#      letzter = jüngster bekannter Wert (z.B. ausstehende Aktien vom Deckblatt)
kennzahlen:
  umsatz:
    art: dauer
    einheit: USD
    konzepte: [us-gaap:Revenues, us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax,
               us-gaap:RevenueFromContractWithCustomerIncludingAssessedTax, us-gaap:SalesRevenueNet,
               us-gaap:SalesRevenueGoodsNet, us-gaap:SalesRevenueServicesNet]
  umsatzkosten:
    art: dauer
    einheit: USD
    konzepte: [us-gaap:CostOfRevenue, us-gaap:CostOfGoodsAndServicesSold, us-gaap:CostOfGoodsSold, us-gaap:CostOfServices]
  bruttoergebnis:
    art: dauer
    einheit: USD
    konzepte: [us-gaap:GrossProfit]
  operatives_ergebnis:
    art: dauer
    einheit: USD
    konzepte: [us-gaap:OperatingIncomeLoss]
  jahresueberschuss:
    art: dauer
    einheit: USD
    konzepte: [us-gaap:NetIncomeLoss, us-gaap:ProfitLoss, us-gaap:NetIncomeLossAvailableToCommonStockholdersBasic]
  operativer_cashflow:
    art: dauer
    einheit: USD
    konzepte: [us-gaap:NetCashProvidedByUsedInOperatingActivities,
               us-gaap:NetCashProvidedByUsedInOperatingActivitiesContinuingOperations]
  abschreibungen:
    art: dauer
    einheit: USD
    konzepte: [us-gaap:DepreciationDepletionAndAmortization, us-gaap:DepreciationAmortizationAndAccretionNet,
               us-gaap:DepreciationAndAmortization, us-gaap:Depreciation]
  vertriebs_verwaltungskosten:
    art: dauer
    einheit: USD
    konzepte: [us-gaap:SellingGeneralAndAdministrativeExpense]
  zinsaufwand:
    art: dauer
    einheit: USD
    konzepte: [us-gaap:InterestExpense, us-gaap:InterestExpenseNonoperating]
  gewichtete_aktien:
    art: dauer
    einheit: shares
    konzepte: [us-gaap:WeightedAverageNumberOfSharesOutstandingBasic, us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding]
  bilanzsumme:
    art: stichtag
    einheit: USD
    konzepte: [us-gaap:Assets]
  umlaufvermoegen:
    art: stichtag
    einheit: USD
    konzepte: [us-gaap:AssetsCurrent]
  kurzfristige_verbindlichkeiten:
    art: stichtag
    einheit: USD
    konzepte: [us-gaap:LiabilitiesCurrent]
  verbindlichkeiten:
    art: stichtag
    einheit: USD
    konzepte: [us-gaap:Liabilities]
  langfristige_finanzschulden:
    art: stichtag
    einheit: USD
    konzepte: [us-gaap:LongTermDebtNoncurrent, us-gaap:LongTermDebt]
  eigenkapital:
    art: stichtag
    einheit: USD
    konzepte: [us-gaap:StockholdersEquity, us-gaap:StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest]
  gewinnruecklagen:
    art: stichtag
    einheit: USD
    konzepte: [us-gaap:RetainedEarningsAccumulatedDeficit]
  forderungen:
    art: stichtag
    einheit: USD
    konzepte: [us-gaap:AccountsReceivableNetCurrent, us-gaap:ReceivablesNetCurrent]
  sachanlagen_netto:
    art: stichtag
    einheit: USD
    konzepte: [us-gaap:PropertyPlantAndEquipmentNet]
  zahlungsmittel:
    art: stichtag
    einheit: USD
    konzepte: [us-gaap:CashAndCashEquivalentsAtCarryingValue,
               us-gaap:CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents]
  wertpapiere_kurzfristig:
    art: stichtag
    einheit: USD
    konzepte: [us-gaap:MarketableSecuritiesCurrent, us-gaap:AvailableForSaleSecuritiesDebtSecuritiesCurrent,
               us-gaap:ShortTermInvestments]
  ergebnis_vor_steuern:
    art: dauer
    einheit: USD
    konzepte: [us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest,
               us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments]
  vertriebskosten:
    art: dauer
    einheit: USD
    konzepte: [us-gaap:SellingAndMarketingExpense]
  verwaltungskosten:
    art: dauer
    einheit: USD
    konzepte: [us-gaap:GeneralAndAdministrativeExpense]
  kurzfristige_finanzschulden:
    art: stichtag
    einheit: USD
    konzepte: [us-gaap:DebtCurrent]
  langfristige_schulden_kurzfristiger_teil:
    art: stichtag
    einheit: USD
    konzepte: [us-gaap:LongTermDebtCurrent]
  kurzfristige_kredite:
    art: stichtag
    einheit: USD
    konzepte: [us-gaap:ShortTermBorrowings, us-gaap:CommercialPaper]
  eigenkapital_inkl_minderheiten:
    art: stichtag
    einheit: USD
    konzepte: [us-gaap:StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest, us-gaap:StockholdersEquity]
  aktien_ausstehend:
    art: letzter
    einheit: shares
    konzepte: [dei:EntityCommonStockSharesOutstanding, us-gaap:CommonStockSharesOutstanding]
