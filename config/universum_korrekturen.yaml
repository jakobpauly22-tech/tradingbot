# Korrekturen der S&P-500-Rekonstruktion aus Wikipedia (src/tradingbot/daten/universum.py).
# Nur Fälle, die die Änderungstabelle nicht oder falsch abbildet. Jeder Eintrag mit Quelle; Jakob prüft.
# Aktionen: beenden (offene Mitgliedschaft schließen), ergaenzen (fehlende Mitgliedschaft), von_setzen (Zugang korrigieren).
# Abgleich: fja05680/sp500 (GitHub, MIT-Lizenz), tägliche Zusammensetzung 1996 bis 11.01.2019.

korrekturen:
  - aktion: beenden
    ticker: BUD
    name: Anheuser Busch
    bis: 2008-11-18
    quelle: "InBev-Übernahme; letzter Tag im Index laut fja05680: 17.11.2008"
  - aktion: beenden
    ticker: FSR
    name: Firstar
    bis: 2001-02-27
    quelle: "Firstar übernahm 2001 U.S. Bancorp und führte Namen und Ticker USB weiter; für den Backtest ab 2012 unerheblich"
  - aktion: beenden
    ticker: FOX
    name: Twenty-First Century Fox Class B
    bis: 2019-03-19
    quelle: "Wikipedia-Änderungstabelle 19.03.2019 (Abgang ohne Ticker, Disney-Übernahme von 21st Century Fox)"
  - aktion: ergaenzen
    ticker: MWV
    name: MeadWestvaco
    von: null
    bis: 2015-07-02
    grund_abgang: "Fusion mit RockTenn zu WestRock"
    quelle: "fja05680: MWV bis 01.07.2015; fehlt in der Wikipedia-Änderungstabelle"
  - aktion: ergaenzen
    ticker: WRK
    name: WestRock
    von: 2015-07-02
    bis: 2024-07-08
    grund_abgang: "Smurfit Kappa übernahm WestRock (Smurfit Westrock, Ticker SW)"
    quelle: "fja05680: WRK ab 02.07.2015; Ende = Aufnahme von Smurfit Westrock laut heutiger Wikipedia-Liste"
  - aktion: von_setzen
    ticker: SW
    name: Smurfit Westrock
    von: 2024-07-08
    quelle: "Aufnahmedatum der heutigen Wikipedia-Liste; Nachfolger von WestRock (WRK)"

