[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot"
version = "0.1.0"
description = "Regelbasierter Trading-Bot: Core/Satellite, vier Signal-Engines, Risk-Manager mit Veto"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "pyarrow>=20",
    "yfinance>=1.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    # ruamel.yaml statt PyYAML: reines Python, für Python 3.15 gibt es noch kein PyYAML-Paket
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]
# Broker (Phase 2). ib_async 2.1.0 verlangt tzdata<2026; das Projekt behält tzdata 2026 (neuere Zeitzonendaten).
# Deshalb: ib_async selbst ohne Abhängigkeiten installieren, seine übrigen Abhängigkeiten stehen hier vollständig:
#   .venv\Scripts\python -m pip install -e ".[dev,broker]"
#   .venv\Scripts\python -m pip install --no-deps ib_async==2.1.0
# Abhängigkeiten von ib_async 2.1.0: aeventkit (>=2.1,<3; braucht numpy), nest_asyncio, tzdata (hier >=2025.2).
broker = ["aeventkit>=2.1.0,<3.0.0", "nest-asyncio>=1.6.0", "numpy", "tzdata>=2025.2"]
# Neue Oberfläche des Tageslaufs (10.11.2026): Theme Sun Valley, reines Python/Tcl, MIT. Ohne das Paket nutzt die
# Oberfläche ein eingebautes ttk-Theme.  .venv\Scripts\python -m pip install -e ".[oberflaeche]"
oberflaeche = ["sv-ttk==2.6.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests mit Internetzugriff laufen nur auf Wunsch: pytest -m netz
addopts = "-m 'not netz'"
markers = [
    "netz: braucht Internet (yfinance, FRED) und ggf. Schlüssel aus .env",
]
